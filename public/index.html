    <summary>Demo: simulate hardware</summary>
    <div class="sim-row"><span>modules (bay)</span>
      <button data-sim="modules" data-val="rs485">plug RS-485</button>
      <button data-sim="modules" data-val="relay">plug relay module</button>
      <button data-sim="modules" data-val="off">unplug</button>
    </div>
    <div class="sim-row"><span>ethernet1</span>
      <button data-sim="ethernet1" data-val="off">drop link</button>
      <button data-sim="ethernet1" data-val="on">restore link</button>
    </div>
    <div class="sim-row"><span>usb / sdcard</span>
      <button data-sim="usb" data-val="on">plug usb</button>
      <button data-sim="usb" data-val="off">unplug usb</button>
      <button data-sim="sdcard" data-val="on">insert sd</button>
      <button data-sim="sdcard" data-val="off">eject sd</button>
    </div>
  </details>
</main>

<div id="tooltip" class="tooltip hidden" role="tooltip"></div>

<div id="modalBackdrop" class="modal-backdrop hidden">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Module bay — RS-485 configuration</h2>
    <form id="configForm">
      <label>Baud rate
        <select name="baud"></select>
      </label>
      <label>Parity
        <select name="parity">
          <option value="none">None</option>
          <option value="even">Even</option>
          <option value="odd">Odd</option>
        </select>
      </label>
      <label>Stop bits
        <select name="stopBits">
          <option value="1">1</option>
          <option value="2">2</option>
        </select>
      </label>
      <label>Data bits
        <select name="dataBits">
          <option value="8">8</option>
          <option value="7">7</option>
        </select>
      </label>
      <p id="formError" class="form-error"></p>
      <div class="modal-actions">
        <button type="button" id="cancelBtn">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
